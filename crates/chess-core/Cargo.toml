[package]
name = "chess-core"
version = "0.1.0"
edition = "2021"
description = "Core chess engine: board/movegen, PGN parsing, opening detection, filter DSL, analysis modules, UCI/AI clients"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
